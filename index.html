<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EFEBE1" />
    <title>VANGO — Point-to-Point Van Service</title>
    <meta name="description" content="Book the whole van. Flat fares, no surge, 24/7 dispatch." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&family=Archivo+Black&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // On-device error console: open the site with /?debug to see real
      // phone errors without connecting to a computer. Also paints red
      // boxes around any element overflowing the screen.
      window.addEventListener("DOMContentLoaded", function () {
        if (location.search.indexOf("debug") === -1) return;
        var s = document.createElement("script");
        s.src = "https://cdn.jsdelivr.net/npm/eruda@3.4.1/eruda.min.js";
        s.onload = function () {
          eruda.init();
          setTimeout(function () {
            var w = document.documentElement.clientWidth;
            var hits = 0;
            document.querySelectorAll("body *").forEach(function (el) {
              if (el.closest("#eruda")) return;
              var r = el.getBoundingClientRect();
              if ((r.right > w + 1 || r.left < -1) && r.width > 8) {
                hits++;
                el.style.outline = "3px solid red";
                el.style.outlineOffset = "-3px";
                console.log("OVERFLOW:", el.tagName + "." + String(el.className).slice(0, 60), Math.round(r.left), "->", Math.round(r.right), "(screen", w + ")");
              }
            });
            console.log("Overflow scan done:", hits, "elements wider than", w);

            // Fleet diagnostics
            setTimeout(function () {
              try {
                var rows = document.querySelectorAll(".fleet-row");
                var info = {
                  intersectionObserver: typeof IntersectionObserver !== "undefined",
                  rowCount: rows.length,
                  rows: [].map.call(rows, function (el) {
                    var r = el.getBoundingClientRect();
                    return {
                      name: (el.querySelector(".f-name") || {}).textContent,
                      cls: el.className,
                      opacity: getComputedStyle(el).opacity,
                      top: Math.round(r.top),
                      height: Math.round(r.height)
                    };
                  })
                };
                console.log("FLEET DIAG:", JSON.stringify(info, null, 1));
              } catch (err) {
                console.log("FLEET DIAG ERROR:", err.message);
              }
            }, 5000);
            eruda.get("console").log("Overflow elements found: " + hits);
          }, 4000);
        };
        document.head.appendChild(s);
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
